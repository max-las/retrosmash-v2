AllCops:
  Exclude:
    - 'bin/**/*'
    - Gemfile
    - Rakefile
  NewCops: enable

Lint/MissingSuper:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/SymbolProc:
  Exclude:
    - server/roda_app.rb
